[package]
name = "neovide_embed_live"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
# Same GTK4/Skia/GL-interop stack as poc/gl_skia_test and poc/neovide_embed (see those crates'
# Cargo.toml/main.rs for why these exact versions/features: skia-safe's GL interface must be
# assembled by hand against libepoxy's `epoxy_glFoo` dispatch-pointer symbols on this machine, so
# no extra "gl"-crate glue is needed here beyond libloading).
gtk4 = { version = "0.11.4", features = ["v4_18"] }
libloading = "0.9.0"
skia-safe = { version = "0.153.3", features = ["gl"] }

# The patched Neovide fork (sibling repo, branch `neovibe-integration`), depended on via its
# `neovide` library target (see the `neovide/` submodule's Cargo.toml `[lib] name =
# "neovide"` — same name as the `[package]`, no rename). Pulls in `neovide::live_harness::LiveHarness`
# (P2's real-`nvim --embed` counterpart to P1's `neovide::demo_harness::DemoHarness`) and
# `neovide::units::PixelRect`.
neovide = { path = "../../neovide" }
