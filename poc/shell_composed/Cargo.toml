[package]
name = "shell_composed"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
# Union of the three source PoCs' dependency stacks (see this crate's own module doc for which
# piece each one backs). Versions/features copied verbatim from wherever each was pinned there —
# no independent re-pinning here.
#
# - shell_chrome: gtk4 (window chrome, GtkPaned, status bar, CSS theming).
# - neovide_embed_live: gtk4 (GtkGLArea + keyboard input) + libloading/skia-safe (GL/Skia interop)
#   + the neovide fork (LiveHarness).
# - webkit_pane: gtk4 + webkit6 (WebView agent pane).
#
# gtk4's feature is the highest of the three ("v4_18", required by webkit6's WebView bindings and
# by neovide_embed_live) — shell_chrome only needed "v4_12", which v4_18 already implies.
gtk4 = { version = "0.11.4", features = ["v4_18"] }
libloading = "0.9.0"
skia-safe = { version = "0.153.3", features = ["gl"] }
webkit6 = "0.6"

# The patched Neovide fork (sibling repo, branch `neovibe-integration`), same path dependency
# `neovide_embed_live` uses — consumed read-only via its existing `live_harness` module, the fork
# itself is not modified.
neovide = { path = "../../neovide" }
